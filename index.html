function studioSplash(done) {
  const sp = document.createElement("div"); sp.className = "splash";
  sp.innerHTML = STUDIO_LOGO_SVG;
  document.body.appendChild(sp);
  let gone = false;
  const finish = () => { if (gone) return; gone = true; sp.classList.add("out"); done(); setTimeout(() => sp.remove(), 600); };
  sp.onclick = finish; setTimeout(finish, 2400);
}

/* ================= Звук (синтез без файлов) ================= */
const sfx = (() => {
  let ctx = null, master = null, noiseBuf = null;
  const on = () => S.sound !== false;
  function ac() {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); master = ctx.createGain(); master.gain.value = .55; const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, { type = "sine", vol = .3, at = 0, slide = 0, attack = .005 } = {}) {
    if (!on()) return; const c = ac(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    const pack = S.cos?.eq?.sound;
    if (pack === "sound_retro") { type = "square"; vol *= .55; } else if (pack === "sound_live") { if (type === "square") type = "triangle"; vol *= .8; freq *= .85; }
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, { vol = .3, at = 0, freq = 2000, q = 1, type = "bandpass", slideTo = 0 } = {}) {
    if (!on()) return; const c = ac(); if (!c) return;
    if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t = c.currentTime + at, src = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    src.buffer = noiseBuf; fl.type = type; fl.frequency.setValueAtTime(freq, t); if (slideTo) fl.frequency.exponentialRampToValueAtTime(slideTo, t + dur); fl.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(master); src.start(t, Math.random() * .5); src.stop(t + dur + .02);
  }
  const N = n => 440 * Math.pow(2, (n - 69) / 12);
  let lastTick = 0;
  return {
    unlock: () => { if (on()) ac(); },
    click: () => tone(1700, .03, { type: "square", vol: .04 }),
    chip: () => { noise(.04, { freq: 3500, q: 3, vol: .35 }); noise(.05, { freq: 2600, q: 4, vol: .25, at: .035 }); },
    tick: (p = 1) => { const now = performance.now(); if (now - lastTick < 22) return; lastTick = now; tone(2200 * p, .018, { type: "square", vol: .05 }); },
    reel: () => { noise(.06, { freq: 900, q: 2, vol: .4 }); tone(160, .08, { type: "triangle", vol: .25 }); },
    deal: () => noise(.09, { freq: 4000, q: .7, vol: .22, slideTo: 1200 }),
    pop: (k = 0) => tone(520 * Math.pow(2, Math.min(k, 24) / 12), .09, { vol: .25, slide: 1.6 }),
    coin: () => { tone(1975, .25, { vol: .16 }); tone(2637, .35, { vol: .1, at: .06 }); },
    win: () => [72, 76, 79, 84].forEach((n, i) => tone(N(n), .22, { type: "triangle", vol: .2, at: i * .08 })),
    big: () => { [72, 76, 79, 84, 88, 91, 96].forEach((n, i) => tone(N(n), .3, { type: "triangle", vol: .2, at: i * .07 })); [0, 1, 2, 3, 4, 5].forEach(i => tone(N(96 + (i % 3) * 4), .15, { vol: .08, at: .5 + i * .06 })); },
    lose: () => tone(220, .35, { type: "triangle", vol: .16, slide: .5 }),
    boom: () => { noise(.6, { type: "lowpass", freq: 1200, slideTo: 80, q: .5, vol: .7 }); tone(110, .5, { vol: .4, slide: .4 }); },
    crack: () => { noise(.25, { type: "highpass", freq: 2500, q: .7, vol: .5 }); noise(.4, { type: "lowpass", freq: 600, slideTo: 90, vol: .5, at: .05 }); },
    whoosh: () => noise(.7, { freq: 400, slideTo: 3200, q: 1.2, vol: .25 }),
    level: () => [67, 72, 76, 79, 84].forEach((n, i) => tone(N(n), .25, { type: "square", vol: .05, at: i * .09 })),
    scrape: () => noise(.05, { freq: 5000, q: .8, vol: .05, type: "highpass" })
  };
})();
// щелчки с замедлением — для колёс
function tickRun(total, g0 = 35, g1 = 380, p = 1) { let t = 0; while (t < total) { const k = t / total; t += g0 + (g1 - g0) * k * k; const at = t; setTimeout(() => sfx.tick(p), at); } }
document.addEventListener("pointerdown", e => { sfx.unlock(); const b = e.target.closest("button"); if (b && !b.disabled && !b.dataset.bet && !b.dataset.k && !b.dataset.spot) sfx.click(); }, true);

/* ================= Запуск ================= */
async function loadState() {
  for (let i = 0; i < 3; i++) { try { await api("state"); return true; } catch (e) { if (i === 2) return e; await sleep(800 * (i + 1)); } }
}
function renderOffline(e) {
  app.innerHTML = `<section class="screen wrap" style="justify-content:center;text-align:center">
    <div class="brand"><b>Лудка</b><span>нет связи</span></div>
    <p>${esc(e?.message || "Не удалось подключиться к серверу.")}</p>
    <button class="btn gold" id="retry">Повторить</button></section>`;
  document.getElementById("retry").onclick = async () => { app.innerHTML = ""; const r = await loadState(); if (r === true) start(); else renderOffline(r); };
}
function start() {
  idleWelcome();
  if (!S.adult && !S.ach.c.rounds) S.toast = `Добро пожаловать! На старте ${fmt(START_CHIPS)} ${bem(START_CHIPS)}.`;
  if (!S.adult) { renderLobby(); ageGate(); } else renderLobby();
  idleWelcomeToast();
  if (!LIVE && API_BASE) setTimeout(() => popToast("Демо-режим: откройте игру в Telegram, чтобы играть с друзьями"), 1500);
}
(function boot() {
  try { TG?.ready?.(); TG?.expand?.();
    const hf = TG?.HapticFeedback; if (hf) for (const k of ["impactOccurred", "notificationOccurred", "selectionChanged"]) { const fn = hf[k]?.bind(hf); if (fn) hf[k] = (...a) => S.vib ? fn(...a) : undefined; } } catch (e) {}
  matchMedia(IDLE_DOCK_MQ).addEventListener?.("change", idleDock);
  const loading = loadState();
  studioSplash(async () => { const r = await loading; if (r === true) start(); else renderOffline(r); });
  // при уходе со стола в игру прячем язычок
  new MutationObserver(() => { const lobby = !!app.querySelector(".lb-head"); idleTabShow(lobby); }).observe(app, { childList: true });
  // перед закрытием отправляем накопленные тапы
  document.addEventListener("visibilitychange", () => { if (document.hidden) tapFlush(); });
})();
</script>

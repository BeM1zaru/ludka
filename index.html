<title>Лудка</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: lobby of three tables; each table is its own world — neon Vegas slots, classic felt roulette, pirate-tavern blackjack. Single dark look by choice. */
:root {
  --ink: #0e0b14;           /* lobby night */
  --panel: #1a1524;
  --line: #2f2740;
  --fg: #f3eefb;
  --muted: #a49bb8;
  --chip: #f2c14e;          /* chip gold */
  --good: #3fd58f;
  --bad: #ff5b6e;
  /* slots */
  --neon-bg: #08061a; --neon-pink: #ff3fb4; --neon-cyan: #35f0ff; --neon-yellow: #ffe95a;
  /* roulette */
  --felt: #0f5a3a; --felt-dark: #0a3f29; --gold: #d9b45a; --rred: #c3242f; --rblack: #15151a;
  /* blackjack */
  --wood: #3a2414; --wood-dark: #24160b; --parch: #efe0b9; --rum: #b5652a;
  --f-body: "Inter", system-ui, sans-serif;
  --f-neon: "Playfair Display", Georgia, serif;
  --f-classic: "Playfair Display", Georgia, serif;
  --f-pirate: "Playfair Display", Georgia, serif;

 8.53515625 -6.25 8.4765625 -8.4375H22.5V-10.52734375C22.5 -16.71875 18.02734375 -21.09375 11.69921875 -21.09375C5.37109375 -21.09375 0.8984375 -16.62109375 0.8984375 -10.3125C0.8984375 -4.00390625 5.4296875 0.46875 11.85546875 0.46875ZM8.53515625 -12.8125C8.80859375 -14.51171875 10.01953125 -15.5078125 11.9140625 -15.5078125C13.80859375 -15.5078125 15.01953125 -14.51171875 15.29296875 -12.8125Z'/%3E%3C/g%3E%3C/g%3E %3Cpath d='M22 34 A32 32 0 0 1 48 16' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' opacity='.45'/%3E%3C/svg%3E");
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 3px solid var(--chip); outline-offset: 2px; }
.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; }
.screen > * { flex-shrink: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bal { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.chipicon { width: 24px; height: 24px; flex: none; background: var(--coin) center / contain no-repeat; filter: drop-shadow(0 1px 2px #0008); }
.back { color: var(--muted); font-weight: 600; padding: 6px 0; }
.pill { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.btn { padding: 14px 16px; border-radius: 14px; font-weight: 800; font-size: 16px; }
.btn.gold { background: var(--chip); color: #2a1b00; }
.btn.ghost { background: var(--panel); border: 1px solid var(--line); }
.toast { background: color-mix(in srgb, var(--good) 15%, var(--panel)); border: 1px solid color-mix(in srgb, var(--good) 45%, transparent); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.fine { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 0; }

/* bets */
.bets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.bet { width: 52px; height: 52px; border-radius: 50%; font-weight: 800; font-size: 13px; color: #241800; background: radial-gradient(circle, var(--chip) 0 46%, #fff4 47% 54%, var(--chip) 55%); box-shadow: 0 0 0 3px #8a6417 inset, 0 4px 10px #0008; }
.betbox { display: grid; gap: 8px; }
.betbar { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; }
.betbar button { height: 44px; border-radius: 12px; background: #ffffff12; border: 1px solid #ffffff22; font-weight: 800; font-size: 16px; color: var(--fg); }
.betbar .betval { display: flex; align-items: center; justify-content: center; gap: 8px; }
.betbar .betval span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; font-weight: 700; }
.betbar .betval b { font-size: 18px; font-variant-numeric: tabular-nums; }
.betbar button:disabled { opacity: .45; }
.betin { font-size: 22px; font-weight: 800; text-align: center; }
.bet[aria-pressed="true"] { transform: translateY(-4px); box-shadow: 0 0 0 3px #fff inset, 0 6px 14px #000a, 0 0 0 3px var(--chip); }

/* ---------- lobby ---------- */
.logo { font-family: var(--f-classic); font-weight: 900; font-size: clamp(38px, 12vw, 52px); line-height: 1; margin: 6px 0 0; }
.logo span { color: var(--chip); }
.tables { display: grid; gap: 12px; }
.table { position: relative; text-align: left; border-radius: 18px; padding: 16px; min-height: 104px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; border: 1px solid var(--line); }
.table h3 { margin: 0; font-size: 26px; line-height: 1.05; }
.table p { margin: 4px 0 0; font-size: 13.5px; opacity: .85; }
.table .deco { position: absolute; right: 14px; top: 10px; font-size: 44px; opacity: .9; }
.t-slots { background: radial-gradient(120% 120% at 100% 0, #3a0b4f 0, var(--neon-bg) 60%); border-color: #4b1e6b; }
.t-slots h3 { font-family: var(--f-neon); font-weight: 400; font-size: 24px; color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink), 0 0 18px #ff3fb488; }
.t-roul { background: radial-gradient(120% 120% at 100% 0, #1b7a52 0, var(--felt-dark) 65%); border-color: #2a6b4c; }
.t-roul h3 { font-family: var(--f-classic); color: var(--gold); }
.t-bj { background: linear-gradient(160deg, #5a3a20, var(--wood-dark)); border-color: #6b4a2a; }
.t-bj h3 { font-family: var(--f-pirate); font-weight: 400; font-size: 30px; color: var(--parch); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: left; }
.tile b { display: block; font-size: 15px; }
.tile span { font-size: 12.5px; color: var(--muted); }

/* ---------- slots ---------- */
.s-slots { background: radial-gradient(100% 70% at 50% 0, #2a0a3d 0, var(--neon-bg) 70%); }
.neon-title { font-family: var(--f-neon); color: var(--neon-cyan); text-shadow: 0 0 6px var(--neon-cyan), 0 0 16px #35f0ff88; font-size: 26px; text-align: center; margin: 4px 0 0; }
.machine { border-radius: 22px; padding: 14px; background: #120b2a; box-shadow: 0 0 0 2px var(--neon-pink), 0 0 22px #ff3fb455, inset 0 0 30px #000; }
.reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.reel { height: 108px; border-radius: 14px; background: linear-gradient(#fff, #e9e4f5 50%, #fff); overflow: hidden; position: relative; box-shadow: inset 0 8px 14px #0005, inset 0 -8px 14px #0005; }
.strip { position: absolute; left: 0; right: 0; top: 0; }
.sym { height: 108px; display: grid; place-items: center; font-size: 54px; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
.sym.seven { font-family: var(--f-neon); font-size: 58px; color: #e0144f; text-shadow: 0 2px 0 #7a001c; }
.payline { text-align: center; min-height: 26px; font-weight: 800; font-size: 18px; color: var(--neon-yellow); text-shadow: 0 0 8px #ffe95a88; }
.paytable { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12.5px; color: #cfc6ee; }
.paytable div { background: #ffffff0d; border-radius: 8px; padding: 6px; text-align: center; }
.spin { background: var(--neon-pink); color: #fff; box-shadow: 0 0 18px #ff3fb488; font-size: 18px; letter-spacing: .06em; }

/* ---------- roulette ---------- */
.s-roul { background: radial-gradient(100% 70% at 50% 0, #17714c 0, var(--felt-dark) 70%); }
.classic-title { font-family: var(--f-classic); color: var(--gold); font-size: 30px; text-align: center; margin: 2px 0 0; }
.wheelbox { display: grid; place-items: center; position: relative; }
.wheel { width: min(64vw, 230px); aspect-ratio: 1; max-width: 100%; transition: transform 4.2s cubic-bezier(.12,.7,.08,1); }
.pointer { position: absolute; top: -4px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 18px solid var(--gold); filter: drop-shadow(0 2px 2px #0008); }
.result { position: absolute; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-classic); font-size: 26px; font-weight: 900; border: 3px solid var(--gold); background: var(--felt-dark); }
.board { display: grid; grid-template-columns: 34px repeat(3, 1fr); gap: 3px; }
.cell { min-height: 30px; border-radius: 5px; font-weight: 800; font-size: 13px; color: #fff; position: relative; border: 1px solid #ffffff22; }
.cell.red { background: var(--rred); } .cell.black { background: var(--rblack); } .cell.green { background: #128a4d; }
.cell .tok { position: absolute; right: -4px; top: -6px; min-width: 20px; height: 20px; padding: 0 3px; box-sizing: border-box; border-radius: 10px; background: var(--chip); color: #241800; font-size: 10.5px; display: grid; place-items: center; box-shadow: 0 2px 4px #0008; }
.zero { grid-row: span 12; }
.outside { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.outside .cell { background: #ffffff10; }
.outside .cell.red { background: var(--rred); } .outside .cell.black { background: var(--rblack); }
.rinfo { display: flex; justify-content: space-between; font-size: 13.5px; color: #d9f0e4; }

/* ---------- blackjack ---------- */
.s-bj { background: radial-gradient(120% 60% at 50% 30%, #6a4426 0, var(--wood-dark) 75%); }
.pirate-title { font-family: var(--f-pirate); color: var(--parch); font-size: 34px; text-align: center; margin: 0; text-shadow: 0 2px 0 #000; }
.hand { min-height: 112px; display: flex; flex-direction: column; gap: 6px; }
.hand .lbl { font-family: var(--f-pirate); font-size: 20px; color: var(--parch); }
.cards { display: flex; gap: 0; }
.card { width: 64px; height: 92px; border-radius: 8px; background: #fbf6e9; color: #1b1b1b; box-shadow: 0 4px 10px #0009; margin-right: -18px; position: relative; font-family: var(--f-classic); font-weight: 900; flex: none; }
.card.fresh { animation: deal .25s ease-out both; }
.card.red { color: #b3121f; }
.card .tl { position: absolute; left: 6px; top: 4px; font-size: 18px; line-height: 1; text-align: center; }
.card .mid { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; }
.card.back { background: repeating-linear-gradient(45deg, #7a2b1b 0 6px, #5a1d12 6px 12px); border: 3px solid var(--parch); box-sizing: border-box; }
@keyframes deal { from { transform: translateY(-30px) rotate(-8deg); opacity: 0 } to { transform: none; opacity: 1 } }
.bjmsg { text-align: center; font-family: var(--f-pirate); font-size: 26px; min-height: 32px; color: var(--parch); }
.bjbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bjbtns .btn { background: var(--rum); color: #fff3df; font-size: 15px; padding: 12px 6px; }

/* ---------- самолётик (краш) ---------- */
.t-crash { background: linear-gradient(160deg, #3b4f9a, #f08a6b 130%); border-color: #5b6fc0; }
.t-crash h3 { font-family: "Playfair Display", Georgia, serif; font-size: 34px; color: #fff; }
.t-road { background: repeating-linear-gradient(90deg, #2b2d31 0 46px, #ffd23f 46px 50px); border-color: #4a4c52; }
.t-road h3 { font-family: "Playfair Display", Georgia, serif; font-weight: 400; font-size: 22px; color: #ffd23f; text-shadow: 0 2px 0 #000; }
.t-road p, .t-road .deco { text-shadow: 0 1px 2px #000; }
.s-crash { background: linear-gradient(180deg, #1d2b64 0, #4a3f8f 55%, #e9846b 130%); }
.paper-title { font-family: "Playfair Display", Georgia, serif; font-size: 40px; color: #fff; text-align: center; margin: 0; line-height: 1; }
.hist { display: flex; gap: 6px; overflow: hidden; mask-image: linear-gradient(90deg, #000 80%, transparent); }
.hist span { flex: none; font-size: 12.5px; font-weight: 800; padding: 3px 8px; border-radius: 20px; background: #ffffff1c; color: #c9d3ff; font-variant-numeric: tabular-nums; }
.hist span.hi { color: #ffd38a; background: #ffb4472a; }
.sky { position: relative; height: 220px; border-radius: 18px; overflow: hidden; background: radial-gradient(120% 90% at 20% 110%, #f5a47a55, transparent 60%), #0f1640aa; border: 1px solid #ffffff22; }
.sky svg.curve { position: absolute; inset: 0; width: 100%; height: 100%; }
.mult { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-body); font-weight: 800; font-size: 46px; color: #fff; text-shadow: 0 2px 12px #0008; font-variant-numeric: tabular-nums; pointer-events: none; }
.mult.lost { color: #ff7b7b; } .mult.won { color: #8ff0b8; }
.mult.end { font-size: 30px; text-align: center; padding: 0 12px; }
.plane { position: absolute; width: 46px; height: 34px; margin: -26px 0 0 -30px; transition: opacity .4s; }
.plane.gone { animation: flyaway .7s ease-in forwards; }
@keyframes flyaway { to { transform: translate(160px, -140px) rotate(-30deg); opacity: 0 } }
.autos { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; color: #dfe4ff; }
.autos button { padding: 6px 10px; border-radius: 20px; background: #ffffff1a; font-weight: 700; font-size: 13px; }
.autos button[aria-pressed="true"] { background: #fff; color: #1d2b64; }
.crashbtn { background: #ff8a5b; color: #2a0f00; font-size: 18px; }
.crashbtn.cash { background: #6ff0a6; color: #00301a; }
.crashmsg { text-align: center; min-height: 20px; font-weight: 700; color: #ffe1c9; }

/* ---------- курочка на дороге ---------- */
.s-road { background: #1c1d21; }
.road-title { font-family: "Playfair Display", Georgia, serif; color: #ffd23f; font-size: 26px; text-align: center; margin: 0; text-shadow: 0 3px 0 #000; }
.roadview { position: relative; height: 250px; overflow: hidden; border-radius: 16px; border: 2px solid #3a3c42; }
.track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; transition: transform .45s ease; }
.side { width: 70px; background: repeating-linear-gradient(0deg, #6b6f78 0 24px, #5e626b 24px 26px); flex: none; }
.side.fin { background: repeating-conic-gradient(#fff 0 25%, #222 0 50%) 0 0/20px 20px; }
.lane { width: 78px; flex: none; position: relative; background: #2b2d31; border-right: 3px dashed #d8d8d855; }
.lane .mlt { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-family: "Playfair Display", Georgia, serif; font-size: 12px; color: #c8cad0; background: #3a3c42; border: 3px solid #4a4c52; }
.lane.next .mlt { border-color: #ffd23f; color: #ffd23f; }
.lane.done .mlt { background: #1f6b45; border-color: #3fd58f; color: #fff; }
.lane .car { position: absolute; left: 50%; top: -70px; font-size: 40px; transform: translateX(-50%) rotate(-90deg); animation: drive var(--d) linear var(--del) infinite; }
.lane.done .car { display: none; }
.lane.done::before { content: "🚧"; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font-size: 26px; }
.lane.hit .car { animation: none; top: 50%; margin-top: -24px; }
@keyframes drive { to { top: 270px; } }
.chicken { position: absolute; top: 50%; font-size: 44px; transform: translate(-50%, -50%) scaleX(-1); transition: left .3s ease; z-index: 2; }
.chicken.dead { transform: translate(-50%, -50%) scale(1.3); }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.levels button { padding: 9px 4px; border-radius: 10px; background: #2b2d31; font-weight: 700; font-size: 13px; border: 1px solid #3a3c42; }
.levels button[aria-pressed="true"] { background: #ffd23f; color: #1c1d21; }
.roadbtn { background: #ffd23f; color: #1c1d21; font-family: "Playfair Display", Georgia, serif; font-weight: 400; }
.roadmsg { text-align: center; min-height: 22px; font-weight: 700; color: #ffe9a3; }

/* ---------- минное поле ---------- */
.t-mines { background: radial-gradient(120% 120% at 100% 0, #1d6f74 0, #0b2326 65%); border-color: #24585c; }
.t-mines h3 { font-family: "Playfair Display", Georgia, serif; font-weight: 400; font-size: 24px; color: #7ff5e4; }
.s-mines { background: radial-gradient(110% 60% at 50% 0, #15474b 0, #071618 75%); }
.mines-title { font-family: "Playfair Display", Georgia, serif; color: #7ff5e4; font-size: 28px; text-align: center; margin: 0; text-shadow: 0 0 14px #7ff5e455; }
.mgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.mcell { aspect-ratio: 1; border-radius: 12px; font-size: 30px; display: grid; place-items: center; background: linear-gradient(#2c6a6e, #1b4a4d); box-shadow: 0 4px 0 #0c2d2f, inset 0 1px 0 #ffffff22; transition: transform .12s; }
.mcell:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 #0c2d2f; }
.mcell.safe { background: #0f3437; box-shadow: inset 0 0 0 2px #3fd58f; animation: pop .25s ease-out; }
.mcell.boom { background: #5a1520; box-shadow: inset 0 0 0 2px var(--bad); animation: pop .25s ease-out; }
.mcell.dim { opacity: .45; }
.mcell:disabled { opacity: 1; }
.mcell.dim:disabled { opacity: .45; }
@keyframes pop { from { transform: scale(.6) } to { transform: none } }
.mcount { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mcount button { padding: 9px 4px; border-radius: 10px; background: #12393c; border: 1px solid #24585c; font-weight: 700; font-size: 13px; }
.mcount button[aria-pressed="true"] { background: #7ff5e4; color: #062022; }
.mbtn { background: #7ff5e4; color: #062022; font-family: "Playfair Display", Georgia, serif; font-weight: 400; }
.minfo { display: flex; justify-content: space-between; font-size: 13.5px; color: #bfe9e3; }
.mmsg { text-align: center; min-height: 22px; font-weight: 700; color: #c9fff6; }

/* ---------- звездопад (плинко) ---------- */
.t-plinko { background: radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 60% 70%, #fff, transparent), radial-gradient(1.5px 1.5px at 80% 20%, #fff, transparent), radial-gradient(120% 120% at 100% 0, #5b2bb5 0, #120a2e 65%); border-color: #3d2a78; }
.t-plinko h3 { font-family: "Playfair Display", Georgia, serif; font-weight: 800; font-size: 22px; background: linear-gradient(90deg, #8fb4ff, #e08cff, #ffb86b); -webkit-background-clip: text; background-clip: text; color: transparent; }
.s-plinko { position: relative; background:
  radial-gradient(1.2px 1.2px at 12% 18%, #ffffffcc, transparent), radial-gradient(1px 1px at 78% 9%, #ffffffaa, transparent),
  radial-gradient(1.4px 1.4px at 90% 44%, #ffffffbb, transparent), radial-gradient(1px 1px at 6% 62%, #ffffff99, transparent),
  radial-gradient(90% 50% at 50% 0, #3a1f7a 0, transparent 70%), radial-gradient(80% 40% at 50% 100%, #5a1f5e66 0, transparent 70%), #0b0720; }
.plinko-title { font-family: "Playfair Display", Georgia, serif; font-weight: 800; font-size: 26px; text-align: center; margin: 0; letter-spacing: .02em; background: linear-gradient(90deg, #8fb4ff, #e08cff 50%, #ffb86b); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px #b67bff55); }
.pboard { position: relative; border-radius: 20px; padding: 6px 4px 8px; background: linear-gradient(180deg, #ffffff0a, #ffffff03); border: 1px solid #ffffff14; box-shadow: inset 0 1px 0 #ffffff12, 0 20px 40px -20px #000; }
.pboard canvas { display: block; width: 100%; }
.phist { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.phist span { font-family: "Playfair Display", Georgia, serif; font-weight: 800; font-size: 10.5px; padding: 4px 7px; border-radius: 7px; color: #fff; text-align: center; min-width: 30px; box-shadow: 0 2px 6px #0007; animation: pin .3s ease-out; }
.phist span:nth-child(n+2) { opacity: .8 } .phist span:nth-child(n+4) { opacity: .5 }
@keyframes pin { from { transform: translateY(-8px) scale(.7); opacity: 0 } }
.prisk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: #ffffff0d; border: 1px solid #ffffff12; }
.prisk button { padding: 9px 4px; border-radius: 10px; font-weight: 700; font-size: 13px; color: #c9c0ff; }
.prisk button[aria-pressed="true"] { background: linear-gradient(135deg, #6d5cff, #c04dff); color: #fff; box-shadow: 0 4px 14px #8b5cff66; }
.pctl { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.pdrop { font-family: "Playfair Display", Georgia, serif; font-weight: 800; font-size: 17px; letter-spacing: .04em; color: #1a0b33; background: linear-gradient(135deg, #ffd27a, #ff8fd0 55%, #a98bff); box-shadow: 0 8px 24px -6px #ff8fd099, inset 0 1px 0 #fff8; }
.pdrop:active { transform: translateY(1px) scale(.99); }
.pauto { padding: 0 16px; border-radius: 14px; font-weight: 800; font-size: 14px; background: #ffffff10; border: 1px solid #ffffff22; color: #e5ddff; }
.pauto[aria-pressed="true"] { background: #ff5a8a; border-color: #ff5a8a; color: #fff; }
.pmsg { text-align: center; min-height: 20px; font-weight: 700; color: #e7dcff; font-variant-numeric: tabular-nums; }

/* ---------- сокровища рифа (каскадный слот) ---------- */
.t-reef { background: linear-gradient(170deg, #0f8fb0 -20%, #07466b 45%, #031e33); border-color: #1a6a8a; }
.t-reef h3 { font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: 23px; color: #ffe08a; text-shadow: 0 2px 0 #7a4a00, 0 0 18px #ffd05a66; }
.s-reef { position: relative; overflow-x: hidden; background: linear-gradient(180deg, #0b7a9c 0, #075173 28%, #042f4c 62%, #021727 100%); transition: background .8s; }
.s-reef.fs { background: linear-gradient(180deg, #4b2a9e 0, #2b1a6e 30%, #160d40 65%, #090522 100%); }
.s-reef > * { position: relative; z-index: 1; }
.s-reef > .rf-rays, .s-reef > .rf-bubbles { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.rf-rays { background: repeating-linear-gradient(105deg, transparent 0 40px, #ffffff0d 40px 70px, transparent 70px 130px); mask-image: linear-gradient(#000, transparent 60%); animation: sway 9s ease-in-out infinite alternate; }
@keyframes sway { from { transform: translateX(-20px) skewX(-4deg) } to { transform: translateX(20px) skewX(4deg) } }
.rf-bubbles i { position: absolute; bottom: -20px; border-radius: 50%; border: 1px solid #bff3ff88; background: radial-gradient(circle at 30% 30%, #ffffff66, transparent 60%); animation: rise linear infinite; }
@keyframes rise { to { transform: translateY(-110vh) translateX(14px) } }
.rf-title { margin: 0; text-align: center; font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: 28px; color: #ffe08a; letter-spacing: .01em; text-shadow: 0 3px 0 #8a5200, 0 0 24px #ffcf4d55; }
.rf-fsbar { display: flex; justify-content: space-between; padding: 8px 14px; border-radius: 12px; background: #ffffff14; border: 1px solid #c9a8ff55; font-weight: 700; color: #eadcff; }
.rf-fsbar[hidden] { display: none; }
.rf-fsbar b { color: #ffe08a; font-size: 17px; display: inline-block; }
.rf-frame { position: relative; padding: 8px; border-radius: 22px; background: linear-gradient(180deg, #ffffff1f, #ffffff08); border: 1px solid #a8ecff40; box-shadow: inset 0 1px 0 #ffffff30, 0 24px 40px -18px #000c; }
.rf-grid { position: relative; aspect-ratio: 6 / 5; overflow: hidden; border-radius: 15px; background: radial-gradient(90% 70% at 50% 20%, #0d6c8c66, #02253a99); }
.rf-cell { position: absolute; width: calc(100% / 6); height: 20%; display: grid; place-items: center; transition: top .42s cubic-bezier(.34, 1.36, .55, 1), left .3s; will-change: top; }
.rf-emo, .rf-scat { font-size: min(9.5vw, 40px); line-height: 1; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; filter: drop-shadow(0 3px 2px #0008); transition: transform .25s; }
.rf-scat { padding: 4px; border-radius: 50%; background: radial-gradient(circle, #ffd86b55, transparent 70%); }
.rf-pearl { width: 78%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 32% 28%, #fff 0 10%, #f6e6ff 22%, #c9a8f0 60%, #8f6cc9 100%); box-shadow: 0 0 14px #e7c8ff99, inset 0 -3px 6px #6b4aa588; }
.rf-pearl b { font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: min(3.6vw, 15px); color: #5a2a00; text-shadow: 0 1px 0 #fff8; }
.rf-cell.hit .rf-emo { transform: scale(1.18); animation: wiggle .5s ease-in-out infinite; filter: drop-shadow(0 0 10px #ffe58a) drop-shadow(0 3px 2px #0008); }
.rf-cell.hit::before { content: ""; position: absolute; inset: 6%; border-radius: 14px; background: radial-gradient(circle, #ffe58a55, transparent 70%); }
@keyframes wiggle { 50% { transform: scale(1.22) rotate(-6deg) } }
.rf-cell.pop { animation: rfpop .32s ease-in forwards; }
@keyframes rfpop { 40% { transform: scale(1.35); opacity: 1 } to { transform: scale(0); opacity: 0 } }
.rf-cell.glow .rf-scat, .rf-cell.glow .rf-pearl { animation: pglow .5s ease-in-out infinite alternate; }
@keyframes pglow { to { transform: scale(1.18); filter: drop-shadow(0 0 14px #fff2a8) } }
.rf-banner { position: absolute; inset: 8px; border-radius: 15px; display: grid; place-content: center; text-align: center; gap: 6px; background: radial-gradient(circle, #1a0f4acc, #090522ee); z-index: 5; }
.rf-banner[hidden] { display: none; }
.rf-banner.show { animation: bnr .45s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes bnr { from { transform: scale(.6); opacity: 0 } }
.rf-banner small { color: #c9b8ff; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
.rf-banner strong { font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: 30px; line-height: 1.05; color: #ffe08a; text-shadow: 0 3px 0 #8a5200, 0 0 30px #ffcf4d77; }
.rf-banner em { font-style: normal; font-weight: 800; color: #9dffc8; font-size: 18px; }
.rf-win { display: flex; justify-content: center; align-items: baseline; gap: 10px; }
.rf-winlbl { color: #a9dbe8; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
.rf-win b { font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: 30px; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px #7fe8ff55; display: inline-block; }
.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); color: #ffe08a } }
.rf-clusters { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 30px; }
.rf-clusters span { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 6px; border-radius: 20px; background: #ffffff16; border: 1px solid #ffffff22; font-size: 13px; font-weight: 700; color: #d8f6ff; animation: pin .3s ease-out; }
.rf-clusters i { font-style: normal; font-size: 17px; }
.rf-clusters b { color: #ffe08a; }
.rf-ctl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.rf-spin { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; color: #4a2600; background: radial-gradient(circle at 35% 30%, #fff3c4, #ffd05a 45%, #e59a1a 100%); box-shadow: 0 0 0 4px #ffffff22, 0 10px 26px -6px #ffb62e99, inset 0 -4px 8px #b46a0088; transition: transform .15s; }
.rf-spin:not(:disabled):active { transform: scale(.94); }
.rf-spin:disabled svg { animation: spinr 1s linear infinite; }
@keyframes spinr { to { transform: rotate(360deg) } }
.rf-side { padding: 11px 8px; border-radius: 12px; background: #ffffff12; border: 1px solid #ffffff22; color: #d8f6ff; font-weight: 700; font-size: 13.5px; }
.rf-side[aria-pressed="true"] { background: #7fe8ff; color: #032234; border-color: #7fe8ff; }
.rf-pt { display: grid; gap: 4px; }
.rf-pt div { display: grid; grid-template-columns: 40px 1fr 1fr 1fr; align-items: center; gap: 4px; background: var(--ink); border-radius: 8px; padding: 6px 8px; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.rf-pt div span { text-align: right; } .rf-pt .e { font-size: 22px; text-align: left; }
.rf-pt .h { background: none; color: var(--muted); font-size: 12px; }

/* ---------- золотой билет (скретч) ---------- */
.t-scratch { background: linear-gradient(135deg, #14110b, #2a2214 60%, #14110b); border-color: #8a6d2f; }
.t-scratch::after { content: ""; position: absolute; inset: 6px; border: 1px solid #c9a24a66; border-radius: 13px; pointer-events: none; }
.t-scratch h3 { font-family: "Playfair Display", Georgia, serif; font-weight: 400; font-size: 27px; color: #f1d58a; letter-spacing: .04em; }
.s-scratch { background: radial-gradient(80% 50% at 50% 0, #2b2414 0, #0c0a07 70%); }
.sc-title { margin: 0; text-align: center; font-family: "Playfair Display", Georgia, serif; font-size: 30px; letter-spacing: .12em; color: #f1d58a; text-shadow: 0 0 20px #f1d58a33; }
.sc-sub { text-align: center; color: #b9a67a; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin-top: -8px; }
.ticket { position: relative; padding: 18px 18px 16px; border-radius: 10px; color: #2a2010;
  background: radial-gradient(circle at 0 50%, transparent 10px, #0000 10px) , linear-gradient(160deg, #fbf3df, #efe1bc 60%, #e8d6a8);
  box-shadow: 0 30px 50px -24px #000, 0 0 0 1px #c9a24a;
  -webkit-mask: radial-gradient(circle 9px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 9px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat; }
.ticket.enter { animation: tin .55s cubic-bezier(.2, 1.2, .4, 1); }
@keyframes tin { from { transform: translateY(40px) rotate(-3deg); opacity: 0 } }
.ticket::before { content: ""; position: absolute; inset: 7px; border: 1.5px solid #b8913a; border-radius: 6px; pointer-events: none;
  background: linear-gradient(45deg, #b8913a 0 2px, transparent 2px) top left / 14px 14px no-repeat, linear-gradient(-45deg, #b8913a 0 2px, transparent 2px) top right / 14px 14px no-repeat; }
.tk-head { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px 10px; border-bottom: 1px dashed #b8913a88; margin-bottom: 12px; }
.tk-head b { font-family: "Playfair Display", Georgia, serif; font-size: 22px; letter-spacing: .1em; color: #6b4e14; }
.tk-head span { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: #8a7444; font-weight: 700; }
.tk-area { position: relative; border-radius: 8px; touch-action: none; }
.tk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tk-cell { aspect-ratio: 1.25; border-radius: 8px; display: grid; place-content: center; text-align: center; background: #fffaf0; border: 1px solid #d9c38f; box-shadow: inset 0 2px 6px #c9a24a33; transition: background .3s, transform .3s, box-shadow .3s; }
.tk-cell b { font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: 19px; color: #3a2a0c; font-variant-numeric: tabular-nums; }
.tk-cell small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #9a8452; font-weight: 700; }
.tk-cell.win { background: linear-gradient(150deg, #ffe7a1, #f1c450); box-shadow: 0 0 0 2px #b8862a, 0 0 18px #f1c45099; animation: twin .6s ease-in-out 3; }
.tk-cell.win b { color: #4a2c00; }
.tk-cell.dim { opacity: .5; }
@keyframes twin { 50% { transform: scale(1.06) } }
.tk-foil { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); border-radius: 10px; cursor: grab; transition: opacity .6s; }
.tk-foil.gone { opacity: 0; pointer-events: none; }
.tk-foot { margin-top: 12px; text-align: center; font-size: 12px; color: #8a7444; letter-spacing: .06em; }
.tk-stamp { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-8deg); padding: 10px 18px; border: 3px solid #a3241c; border-radius: 10px; color: #a3241c; font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: 24px; text-align: center; line-height: 1.1; background: #fbf3dfee; animation: stamp .4s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none; z-index: 3; }
.tk-stamp.good { color: #1f6b3a; border-color: #1f6b3a; }
.tk-stamp small { display: block; font-size: 12px; letter-spacing: .14em; font-weight: 700; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-8deg) scale(2.2); opacity: 0 } }
.sc-prizes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.sc-prizes span { font-size: 12px; padding: 4px 9px; border-radius: 20px; border: 1px solid #8a6d2f88; color: #e7d29c; font-variant-numeric: tabular-nums; }
.sc-btn { background: linear-gradient(135deg, #f6dc8f, #c9962e); color: #2a1a00; font-family: "Playfair Display", Georgia, serif; font-weight: 400; font-size: 20px; letter-spacing: .08em; box-shadow: 0 8px 22px -8px #c9962e99; }
.sc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- джекпот ---------- */
.jp-banner { position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 16px; background: linear-gradient(110deg, #3a2400, #7a4e00 40%, #3a2400); border: 1px solid #f2c14e88; box-shadow: 0 0 24px #f2c14e33, inset 0 1px 0 #ffe9a855; }
.jp-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, #fff3 50%, transparent 70%); transform: translateX(-100%); animation: shine 3.2s ease-in-out infinite; }
@keyframes shine { 60%, 100% { transform: translateX(100%) } }
.jp-banner span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #ffe2a0; font-weight: 800; }
.jp-banner b, .jp-mini b { font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; color: #ffd75e; text-shadow: 0 0 12px #ffb80066; }
.jp-banner b { font-size: 24px; }
.jp-mini { align-self: center; padding: 5px 14px; border-radius: 20px; background: #00000055; border: 1px solid #f2c14e66; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #ffe2a0; font-weight: 800; }
.jp-mini b { font-size: 15px; letter-spacing: 0; margin-left: 6px; }
.jp-win { position: fixed; inset: 0; z-index: 30; display: grid; place-content: center; text-align: center; gap: 10px; background: radial-gradient(circle, #5a3a00ee, #120a00f5 70%); overflow: hidden; }
.jp-win h2 { margin: 0; font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: 44px; color: #ffd75e; text-shadow: 0 4px 0 #7a4a00, 0 0 40px #ffb800; animation: bnr .6s cubic-bezier(.3, 1.6, .5, 1); }
.jp-win strong { font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: 40px; color: #fff; font-variant-numeric: tabular-nums; }
.jp-win .btn { position: relative; z-index: 2; justify-self: center; min-width: 200px; }
.jp-win i { position: absolute; top: -40px; width: 30px; height: 30px; background: var(--coin) center / contain no-repeat; animation: coinfall linear infinite; }
@keyframes coinfall { to { transform: translateY(115vh) rotate(720deg) } }

/* ---------- колесо удачи (карнавал) ---------- */
.t-wheel { background: repeating-conic-gradient(from 0deg at 110% 50%, #c4162a 0 10deg, #f6e7c8 10deg 20deg); border-color: #e2b23c; }
.t-wheel::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #2a0508ee 30%, #2a050888 70%, transparent); }
.t-wheel > * { position: relative; }
.t-wheel h3 { font-family: "Playfair Display", Georgia, serif; font-weight: 400; font-size: 30px; color: #ffd75e; text-shadow: 0 2px 0 #7a0010; }
.s-wheel { background: radial-gradient(120% 60% at 50% 0, #7a0f1d 0, #3a0710 55%, #1a0307 100%); }
.wh-title { margin: 0; text-align: center; font-family: "Playfair Display", Georgia, serif; font-weight: 400; font-size: 36px; color: #ffd75e; text-shadow: 0 3px 0 #7a0010, 0 0 24px #ffb80044; }
.wh-stage { position: relative; display: grid; place-items: center; padding-top: 10px; }
.wh-wrap { position: relative; width: min(84vw, 330px); aspect-ratio: 1; }
.wh-wheel, .wh-rim { position: absolute; inset: 0; width: 100%; height: 100%; }
.wh-wheel { transition: transform 5.2s cubic-bezier(.1, .72, .07, 1); border-radius: 50%; will-change: transform; }
.wh-wheel svg { display: block; }
.wh-rim .bulb { animation: bulb 1s steps(1) infinite; }
.wh-rim .bulb.b2 { animation-delay: .5s; }
@keyframes bulb { 50% { fill: #5a3a10 } }
.wh-rim.whirl .bulb { animation-duration: .25s; }

.bw-rays { position: absolute; width: 160vmax; height: 160vmax; left: 50%; top: 50%; margin: -80vmax 0 0 -80vmax; background: repeating-conic-gradient(from 0deg, #ffd75e22 0 8deg, transparent 8deg 20deg); animation: rays 12s linear infinite; }

.bigwin i { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; background: var(--coin) center / contain no-repeat; animation: burst 1.4s cubic-bezier(.2, .8, .3, 1) var(--d) both; }
@keyframes burst { from { transform: rotate(var(--a)) translateY(0) scale(.3); opacity: 1 } to { transform: rotate(var(--a)) translateY(-46vmin) scale(1) rotate(200deg); opacity: 0 } }

.bigwin.mega { background: radial-gradient(circle, #24104acc, #07041aee 70%); }
.bigwin.mega .bw-rays { background: repeating-conic-gradient(from 0deg, #b46bff26 0 8deg, transparent 8deg 14deg, #46e0a826 14deg 22deg, transparent 22deg 30deg); }
.bw-in strong { font-family: "Inter", system-ui, sans-serif; font-weight: 900; font-size: clamp(38px, 12vw, 56px); color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 0 24px #fff6; }
.bw-in em { font-style: normal; font-weight: 800; font-size: 18px; color: #9dffc8; }
.bw-in small { margin-top: 18px; font-size: 12px; color: #ffffff80; letter-spacing: .08em; }
/* ---------- modal & shop ---------- */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(5, 3, 10, .78); display: grid; align-items: end; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { max-width: 448px; width: 100%; margin: 0 auto; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; line-height: 1.45; display: grid; gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--f-classic); font-size: 24px; }
.sheet p { margin: 0; color: var(--muted); }
.pack { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; text-align: left; }
.pack b { font-variant-numeric: tabular-nums; }
.spent { display: flex; justify-content: space-between; font-size: 13.5px; background: var(--ink); border-radius: 10px; padding: 10px 12px; }
.lb { display: grid; gap: 6px; }
.lb div { display: flex; justify-content: space-between; background: var(--panel); border-radius: 10px; padding: 10px 12px; font-variant-numeric: tabular-nums; }

/* ===================================================================
   ПРЕМИУМ-СТИЛЬ — общая тема поверх всех экранов
   Палитра: слива и чёрный, золото, слоновая кость. Заголовки — Playfair Display, текст — Inter.
   =================================================================== */
:root {
  --ink: #0d0911; --panel: #160f1a; --panel2: #1d1422; --line: #e3c27a2e; --line2: #e3c27a55;
  --fg: #f3ece2; --muted: #a8998a; --chip: #e3c27a; --gold: #e3c27a; --gold-hi: #f5dfa8; --gold-lo: #b88a3a;
  --good: #6fd3a0; --bad: #e0606c; --r: 4px;
}
body { background: #0a080d; }
.app { background: linear-gradient(180deg, #1c1024 0%, #0d0911 45%, #0a080d 100%); }
h1, h2, h3 { font-family: var(--f-classic); }
.back { color: var(--gold); font-weight: 600; letter-spacing: .02em; }
.bal { font-weight: 700; color: var(--fg); }
.btn { border-radius: var(--r); font-weight: 700; letter-spacing: .02em; }
.btn.gold { background: linear-gradient(180deg, var(--gold-hi), #c9a24a); color: #2b1a0c; font-family: var(--f-classic); font-weight: 800; font-size: 18px; letter-spacing: .04em; box-shadow: 0 6px 18px -8px #e3c27a99; }
.btn.ghost { background: transparent; border: 1px solid var(--line2); color: var(--fg); }
.tile { border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.toast { border-radius: var(--r); background: #e3c27a14; border: 1px solid var(--line2); color: var(--gold-hi); }
.fine { color: var(--muted); }
.linkbtn { color: var(--gold); }
/* ставки */
.bet { width: 50px; height: 50px; color: var(--gold); font-weight: 700; background: transparent; box-shadow: none; border: 1.5px dashed var(--gold); }
.bet[aria-pressed="true"] { transform: none; background: radial-gradient(circle at 40% 35%, var(--gold-hi), #c9a24a); color: #2b1a0c; border: 2px solid var(--gold-hi); box-shadow: 0 0 0 3px #e3c27a33, 0 6px 16px -6px #e3c27aaa; font-weight: 800; }
.betbar button { border-radius: var(--r); background: transparent; border: 1px solid var(--line2); color: var(--gold-hi); }
.betbar .betval span { color: var(--muted); opacity: 1; }
/* окна */
.modal { background: rgba(6, 3, 8, .82); backdrop-filter: blur(3px); }
.sheet { background: linear-gradient(180deg, #1a1220, #120c16); border: 1px solid var(--line2); border-radius: 6px; box-shadow: 0 30px 60px -20px #000; }
.sheet h2 { font-family: var(--f-classic); font-weight: 800; color: var(--gold-hi); font-size: 26px; }
.pack, .spent, .quest, .sday, .fund, .faq details, .rtp div, .rg-opts button, .ach, .hrow, .hfil button, .sup-ta { border-radius: var(--r) !important; }
.pack { background: #0e0a11; border-color: var(--line2); }
.pack:not(:disabled):hover { border-color: var(--gold); }
.rg-opts button[aria-pressed="true"], .hfil button[aria-pressed="true"] { background: var(--gold); color: #2b1a0c; border-color: var(--gold); }
.qbar, .xpbar { border-radius: 0 !important; height: 3px; background: #2b2230; }
.qbar i, .xpbar i { border-radius: 0 !important; background: var(--gold) !important; }
.xpbar.big { height: 4px; }
.ptoast { border-radius: var(--r); background: linear-gradient(180deg, var(--gold-hi), #c9a24a); color: #2b1a0c; font-weight: 700; border: 1px solid #fff3; }
.sday.now { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 14px #e3c27a44; }
.sday.now b { color: var(--gold-hi); }
.chestq { background: linear-gradient(135deg, #2a1d10, #0e0a11); border-color: var(--line2); }
.fw-wheel { box-shadow: 0 0 0 4px var(--gold), 0 10px 30px #000a; }
.ach.got { border-color: var(--line2); background: linear-gradient(135deg, #e3c27a14, #0e0a11); }
.ach.got em { color: var(--gold); }
/* лобби */
.brand { padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 0; align-items: center; }
.brand b { font-family: var(--f-classic); font-weight: 800; font-size: 30px; letter-spacing: .01em; background: none; -webkit-background-clip: initial; background-clip: initial; color: var(--gold); }
.brand span { color: var(--muted); font-weight: 600; letter-spacing: .14em; font-size: 10.5px; }
.avatar { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); font-family: var(--f-classic); font-weight: 800; box-shadow: none; }
.lvbadge { background: var(--gold); color: #2b1a0c; box-shadow: 0 0 0 2px var(--ink); }
.lb-who b { font-weight: 700; }
.jp-banner { flex-direction: column; justify-content: center; gap: 4px; text-align: center; padding: 18px; border-radius: var(--r); border: 1px solid #e3c27a77; background: radial-gradient(120% 130% at 50% 0%, #3a2414 0%, #150d10 70%); box-shadow: none; }
.jp-banner::after { background: linear-gradient(100deg, transparent 35%, #f5dfa81f 50%, transparent 65%); }
.jp-banner span { color: #c7b08a; font-weight: 600; letter-spacing: .32em; font-size: 10.5px; }
.jp-banner b { font-family: var(--f-classic); font-weight: 800; font-size: 40px; color: var(--gold-hi); text-shadow: none; line-height: 1.05; }
.jp-banner small { color: #8f7f6c; font-size: 11px; }
.jp-mini { border-radius: var(--r); background: #0006; border: 1px solid var(--line2); color: #c7b08a; }
.jp-mini b { font-family: var(--f-classic); color: var(--gold-hi); text-shadow: none; }
.gifts { gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.gift { border-radius: 0; background: transparent; border: 0; border-right: 1px solid var(--line); padding: 14px 6px 12px; gap: 3px; }
.gift:last-child { border-right: 0; }
.gift .gi { width: 24px; height: 24px; color: var(--gold); margin-bottom: 4px; animation: none !important; }
.gift .gi svg, .ti svg { width: 100%; height: 100%; display: block; }
.gift b { font-weight: 600; font-size: 12.5px; }
.gift small { color: var(--muted); }
.gift.ready { background: #e3c27a0d; }
.gift.ready small { color: var(--gold); }
.gift.ready::after { width: 6px; height: 6px; background: var(--gold); box-shadow: 0 0 8px var(--gold); top: 10px; right: 10px; }
.sec { color: #c7b08a; font-weight: 600; letter-spacing: .24em; font-size: 10.5px; margin-top: 6px; }
.tabs { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0; gap: 0; grid-auto-columns: auto; justify-content: start; column-gap: 22px; background: linear-gradient(#120c16 70%, transparent); }
.tabs button { border-radius: 0; padding: 10px 0; color: var(--muted); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { background: none; color: var(--gold); font-weight: 700; border-bottom-color: var(--gold); }
.tables { gap: 10px; }
.table { border-radius: var(--r) !important; min-height: 92px; padding: 16px 70px 16px 18px; justify-content: center; border: 1px solid #e3c27a44 !important; box-shadow: none !important; }
.table::before, .table::after { display: none !important; }
.table > * { position: relative; }
.table h3 { font-family: var(--f-classic) !important; font-weight: 800 !important; font-size: 23px !important; color: var(--gold-hi) !important; text-shadow: none !important; letter-spacing: 0 !important; background: none !important; -webkit-text-fill-color: currentColor !important; }
.table p { font-size: 12px; color: #c9bba8 !important; opacity: 1; }
.table .deco { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; color: var(--gold); opacity: .95; font-size: 0; }
.table .deco svg { width: 100%; height: 100%; display: block; }
.tcard .table p { padding-right: 0; }
.tcard .table { padding-right: 112px; }
.favbtn { right: 70px; top: 50%; bottom: auto; transform: translateY(-50%); width: 32px; height: 32px; background: transparent; backdrop-filter: none; color: #e3c27a66; font-size: 18px; }
.favbtn[aria-pressed="true"] { color: var(--gold); background: transparent; text-shadow: 0 0 10px #e3c27a88; }
.table.mini { min-height: 86px; padding: 12px 14px; justify-content: flex-end; }
.table.mini h3 { font-size: 17px !important; }
.table.mini .deco { width: 26px; height: 26px; top: 14px; right: 12px; transform: none; }
/* сукно и материалы карточек — глубокие «драгоценные» тона */
.t-slots { background: linear-gradient(110deg, #3d0f24, #1a0710) !important; }
.t-reef { background: linear-gradient(110deg, #0d2a40, #07141f) !important; }

.t-plinko { background: linear-gradient(110deg, #2a1640, #120b1c) !important; }
.t-road { background: linear-gradient(110deg, #2a2620, #12100d) !important; }

.row3 .tile { display: grid; justify-items: center; text-align: center; gap: 3px; padding: 14px 6px; }

.tw-tile { border-radius: var(--r) !important; background: linear-gradient(180deg, #2c4a68, #1d3450) !important; box-shadow: inset 0 0 0 1px #e3c27a2a, 0 3px 0 #0b1520 !important; }

  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

/* бесплатное колесо дня */
const FW_ORDER = [500, 3000, 1000, 10000, 1500, 5000, 2000, 25000];
function freeWheel() {
  const ready = S.wheelDay !== today(), n = FW_ORDER.length, seg = 360 / n;
  const cols = ["#f2c14e", "#c4162a", "#3fa7ff", "#1d1640", "#20b26b", "#b05cff", "#ff7a45", "#14112b"];
  let sv = "";
  FW_ORDER.forEach((v, i) => { const a0 = (i * seg - seg / 2) * Math.PI / 180, a1 = (i * seg + seg / 2) * Math.PI / 180;
    sv += `<path d="M100 100 L${100 + 96 * Math.sin(a0)} ${100 - 96 * Math.cos(a0)} A96 96 0 0 1 ${100 + 96 * Math.sin(a1)} ${100 - 96 * Math.cos(a1)} Z" fill="${cols[i]}" stroke="#f2c14e" stroke-width="1.5"/>`;
    sv += `<text x="100" y="30" transform="rotate(${i * seg} 100 100)" text-anchor="middle" dominant-baseline="middle" font-size="${v >= 10000 ? 13 : 15}" font-weight="900" font-family="Inter, sans-serif" fill="${i === 0 ? "#3a2600" : "#fff"}">${v >= 1000 ? v / 1000 + "K" : v}</text>`; });
  modal(`<h2>Колесо дня</h2><p>Один бесплатный оборот в день — без ставки.</p>
    <div class="fw-wrap"><div class="fw-wheel" id="fw"><svg viewBox="0 0 200 200" width="100%" height="100%">${sv}<circle cx="100" cy="100" r="18" fill="#f2c14e" stroke="#8a6417" stroke-width="3"/></svg></div></div>
    <div id="fwres" class="fw-res" role="status">${ready ? "" : "Сегодня колесо уже крутили. Приходите завтра!"}</div>
    ${ready ? `<button class="btn gold" id="go">Крутить бесплатно</button>` : ""}
    <button class="btn ghost" id="close">Закрыть</button>`, (m, close) => {
    let spinning = false;
    m.querySelector("#close").onclick = () => { if (!spinning) { close(); renderLobby(); } };
    const go = m.querySelector("#go"); if (!go) return;
    go.onclick = async () => {
      if (spinning) return; spinning = true; go.disabled = true;
      let res; try { res = await api("fwheel.spin", {}, r => { r.d = r.r.prize; S.hold += r.d; }); } catch (e) { spinning = false; go.disabled = false; return apiErr(e); }
      const prize = res.r.prize, idx = FW_ORDER.indexOf(prize);
      m.querySelector("#fw").style.transform = `rotate(${360 * 6 + 360 - idx * seg + (rand(30) - 15) / 1.5}deg)`;
      tickRun(4200, 30, 420);
      setTimeout(() => { sfx.coin(); S.hold = Math.max(0, S.hold - res.d); balRender(); m.querySelector("#fwres").innerHTML = `<b>+${fmt(prize)}</b> ${bem(prize)}!`; go.remove(); spinning = false; try { TG?.HapticFeedback?.notificationOccurred("success"); } catch (e) {} }, 4300);
    };
  });
}

// сессия — только для напоминаний: время, раунды и итог игр без бонусов
function sessTouch(bet) {
  const now = Date.now();
  if (!S.sess || now - S.sess.last > 15 * 60000) S.sess = { start: now, last: now, net: 0, rounds: 0, wager: 0, shown: 0 };
  S.sess.last = now; S.sess.rounds++; S.sess.wager += bet;
  store.set("sess", S.sess);
  const mins = S.rg.remind;
  if (mins && now - S.sess.start >= mins * 60000 * (S.sess.shown + 1)) { S.sess.shown++; store.set("sess", S.sess); setTimeout(rgReminder, 1500); }
}
function sessNote(net) { if (S.sess) { S.sess.net = (S.sess.net || 0) + net; store.set("sess", S.sess); } }
function sessNet() { return S.sess ? S.sess.net || 0 : 0; }
const achClaim = id => { if (!S.ach.got[id]) api("ach.claim", { id }).then(r => showEv(r.ev)).catch(() => {}); };

function bigWin(amount, mult) {
  document.querySelector(".bigwin")?.remove();
  const tier = mult >= 100 ? ["mega", "МЕГА<br>ВЫИГРЫШ"] : mult >= 50 ? ["huge", "ОГРОМНЫЙ<br>ВЫИГРЫШ"] : ["big", "КРУПНЫЙ<br>ВЫИГРЫШ"];
  const w = document.createElement("div"); w.className = "bigwin " + tier[0]; w.setAttribute("role", "status");
  w.innerHTML = `<div class="bw-rays" aria-hidden="true"></div>${Array.from({ length: 18 }, (_, i) => `<i style="--a:${i * 20}deg;--d:${(i % 3) * .08}s"></i>`).join("")}
    <div class="bw-in"><h2>${tier[1]}</h2><strong id="bwc">0</strong><em>×${fmt(Math.round(mult * 100) / 100)}</em><button class="btn gold bw-share" id="bwshare">Похвастаться</button><small>Нажмите, чтобы продолжить</small></div>`;
  document.body.appendChild(w);
  const el = w.querySelector("#bwc"), dur = mult >= 100 ? 3000 : mult >= 50 ? 2400 : 1800, t0 = performance.now();
  let done = false;
  const run = now => { if (done) return; const k = Math.min(1, (now - t0) / dur); el.textContent = fmt(Math.floor(amount * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(run); else { done = true; } };
  requestAnimationFrame(run);
  try { window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred("success"); } catch (e) {}
  const close = () => { w.classList.add("out"); setTimeout(() => w.remove(), 400); };
  w.onclick = () => { if (!done) { done = true; el.textContent = fmt(Math.floor(amount)); } else close(); };
  w.querySelector("#bwshare").onclick = e => { e.stopPropagation(); done = true; close(); shareWin(Math.floor(amount), mult, S.cur); };
  setTimeout(() => { if (w.isConnected) { done = true; el.textContent = fmt(Math.floor(amount)); setTimeout(close, 1400); } }, dur + 200);
}

// LIVE: сервер выставляет счёт, Telegram принимает оплату, сервер зачисляет. Демо: зачисляем сразу.
async function buy(kind, id, label, back, to) {
  const pr = E.product(kind, id); if (!pr) return;
  if (LIVE) {
    const res = await post("/invoice", { kind, id, ...(to ? { to } : {}) });
    if (res.error) return popToast(res.error);
    if (!TG.openInvoice) return popToast("Обновите Telegram, чтобы оплатить");
    TG.openInvoice(res.link, async status => {
      if (status === "paid") { sfx.coin(); popToast(to ? "🎁 Оплата прошла — подарок отправлен" : "Оплата прошла — зачисляем…"); await payRefresh(); back && back(); }
      else if (status === "failed") popToast("Оплата не прошла");
    });
    return;
  }
  modal(`<h2>${esc(label)}</h2><p>Стоимость: <b style="color:var(--gold-hi)">${pr.stars} ⭐</b>. ${kind === "pack" ? "Бемки нельзя вывести или передать." : "Это оформление — на шансы и выигрыши не влияет."} Покупка учитывается в ваших лимитах.</p>
    <p class="fine">Демо: в Telegram здесь откроется оплата звёздами.</p>
    <button class="btn gold" id="yes">${to ? "Подарить" : "Купить"} за ${pr.stars} ⭐</button><button class="btn ghost" id="no">Отмена</button>`, (m, close) => {
    m.querySelector("#no").onclick = close;
    m.querySelector("#yes").onclick = async () => {
      try { await api("shop.demo", { kind, id, ...(to ? { to } : {}) }); } catch (e) { close(); return apiErr(e); }
      sfx.coin(); close();
      popToast(to ? "🎁 Подарок отправлен (демо)" : kind === "pack" ? `+${fmt(PACKS.find(p => p.id === id).chips)} бемок (демо)` : `✓ ${label}`); back && back();
    };
  });
}
// после оплаты сервер зачисляет за пару секунд — подтягиваем свежие данные

function winCard(amount, mult, game) {
  const W = 900, H = 900, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const bg = x.createRadialGradient(W / 2, 260, 40, W / 2, 420, 720); bg.addColorStop(0, "#3a2414"); bg.addColorStop(.55, "#1a0f18"); bg.addColorStop(1, "#0a080d");
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  x.save(); x.translate(W / 2, 420); for (let i = 0; i < 36; i++) { x.rotate(Math.PI / 18); x.fillStyle = i % 2 ? "rgba(227,194,122,.05)" : "rgba(227,194,122,.0)"; x.beginPath(); x.moveTo(0, 0); x.lineTo(-90, -900); x.lineTo(90, -900); x.fill(); } x.restore();

let rBets = {}, wheelAngle = 0, rSpinning = false;
function wheelSVG() {
  const R = 100, seg = 360 / 37; let s = "";

    s += `<path d="M100 100 L${100 + R * Math.cos(a0)} ${100 + R * Math.sin(a0)} A${R} ${R} 0 0 1 ${100 + R * Math.cos(a1)} ${100 + R * Math.sin(a1)} Z" fill="${c}" stroke="#d9b45a" stroke-width=".6"/>`;
    const am = (i * seg - 90) * Math.PI / 180;
    s += `<text x="${100 + 86 * Math.cos(am)}" y="${100 + 86 * Math.sin(am)}" fill="#fff" font-size="8" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(${i * seg} ${100 + 86 * Math.cos(am)} ${100 + 86 * Math.sin(am)})">${n}</text>`;
  });
  return `<svg class="wheel" id="wheel" viewBox="0 0 200 200" style="transform:rotate(${wheelAngle}deg)">${s}<circle cx="100" cy="100" r="62" fill="#0a3f29" stroke="#d9b45a" stroke-width="2"/></svg>`;
}

const histHTML = () => (S.crashHist || []).map(h => `<span class="${h >= 2 ? "hi" : ""}">${h.toFixed(2)}×</span>`).join("");
function renderCrash() {
  const flying = cr.state === "flying";
  app.innerHTML = `<section class="screen wrap s-crash">
    <div class="topbar"><button class="back" id="back">← Лобби</button>${balHTML()}</div>
    <h2 class="paper-title">Самолётик</h2>
    <div class="hist" id="hist">${histHTML()}</div>
    <div class="sky"><svg class="curve" viewBox="0 0 300 180" preserveAspectRatio="none"><path id="area" fill="#e3c27a22"/><path id="line" fill="none" stroke="#e3c27a" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>
      <div class="plane" id="plane" style="left:2%;top:97%">${planeHTML()}</div><div class="mult" id="mult" role="status">1.00×</div></div>
    <div class="crashmsg" id="cmsg">Сделайте ставку и взлетайте</div>
    ${betsHTML()}
    <div class="autos" role="group" aria-label="Автовывод"><span>Автовывод:</span>${AUTOS.map(a => `<button data-auto="${a}" aria-pressed="${a === cr.auto}">${a ? a + "×" : "выкл"}</button>`).join("")}</div>
    <button class="btn crashbtn" id="cbtn">Взлёт</button>
    <p class="fine" style="text-align:center;color:#d6dcff">Множитель растёт, пока самолётик летит. Не успели забрать — ставка сгорает.</p>
  </section>`;
  const root = app.querySelector(".screen");
  wireBets(root);
  root.querySelectorAll("[data-auto]").forEach(b => b.onclick = () => { if (cr.state !== "idle") return; cr.auto = +b.dataset.auto; root.querySelectorAll("[data-auto]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  document.getElementById("back").onclick = () => {
    if (["starting", "flying", "cashing"].includes(cr.state)) return;
    cr.state = "idle"; renderLobby();
  };
  document.getElementById("cbtn").onclick = () => cr.state === "flying" ? cashOut() : crashStart();
  if (!flying && cr.state === "idle" && S.g?.k === "crash") crashFly(S.g.bet, S.g.auto, S.g.el + 300);
}
function crashFly(bet, auto, el) {
  Object.assign(cr, { state: "flying", bet, auto, point: 0, m: 1, t0: performance.now() - (el || 0), id: (cr.id || 0) + 1 });
  sfx.whoosh();
  const b = document.getElementById("cbtn"); b.classList.add("cash");
  document.getElementById("cmsg").textContent = cr.auto ? `Автовывод на ${cr.auto}×` : "Жмите «Забрать» вовремя!";
  document.getElementById("mult").className = "mult";
  document.getElementById("plane").classList.remove("gone");
  document.querySelectorAll("[data-auto],[data-bet],[data-bop]").forEach(x => x.disabled = true);
  requestAnimationFrame(crashTick); crashWatch(cr.id);
}
async function crashStart() {
  if (cr.state !== "idle" || !canBet(S.bet, renderCrash)) return;
  cr.state = "starting"; const bet = S.bet; sessTouch(bet); S.lastBet = bet;
  document.getElementById("cbtn").disabled = true;
  let res;
  try { res = await api("crash.start", { bet, auto: cr.auto }); } catch (e) { cr.state = "idle"; const b = document.getElementById("cbtn"); if (b) b.disabled = false; return apiErr(e, renderCrash); }
  showEv(res.ev);
  document.getElementById("cbtn").disabled = false;
  crashFly(bet, cr.auto, 0);
}
// ждём, когда сервер скажет, где самолётик упал
async function crashWatch(id) {
  while (cr.id === id && !cr.point) {
    let res; try { res = await api("crash.watch"); } catch (e) { await sleep(1500); continue; }
    if (res.r.flying) continue;
    if (cr.id !== id) return;
    crashResult(res); return;
  }
}
function crashResult(res) {
  const r = res.r; if (cr.point) return;
  cr.point = r.point || cr.m;
  if (cr.state === "flying" || cr.state === "cashing") {
    showEv(res.ev);
    if (r.pay > 0) crashCashedUI(r); // сработал автовывод на сервере
  }
}
function crashCashedUI(r) {
  if (cr.state === "cashed") return;
  cr.state = "cashed"; sessNote(r.pay - cr.bet); winUI(r.pay, cr.bet, r.m);
  const b = document.getElementById("cbtn"); if (b) { b.classList.remove("cash"); b.textContent = "Ждём посадки…"; b.disabled = true; }
  const msg = document.getElementById("cmsg"); if (msg) msg.textContent = `Забрали на ${r.m.toFixed(2)}×: +${fmt(r.pay - cr.bet)}`;
  const mu = document.getElementById("mult"); if (mu) mu.classList.add("won");
}
function crashDraw(m, t) {
  const W = Math.max(8, t), H = Math.max(2, m * 1.15), px = s => 5 + s / W * 285, py = v => 175 - (v - 1) / (H - 1) * 160;
  let d = "M5 175";
  for (let i = 1; i <= 40; i++) { const s = t * i / 40; d += ` L${px(s).toFixed(1)} ${py(Math.exp(CRASH_SPEED * s)).toFixed(1)}`; }
  const line = document.getElementById("line"); if (!line) return;
  line.setAttribute("d", d); document.getElementById("area").setAttribute("d", d + ` L${px(t)} 180 L5 180 Z`);
  const pl = document.getElementById("plane");
  pl.style.left = px(t) / 3 + "%"; pl.style.top = py(m) / 1.8 + "%";
  const b = document.getElementById("cbtn");
  if (cr.state === "flying") b.textContent = `Забрать ${fmt(Math.floor(cr.bet * m))}`;
  document.getElementById("mult").textContent = m.toFixed(2) + "×";
}
function crashTick(now) {
  if (!["flying", "cashing", "cashed"].includes(cr.state)) return;
  const t = (now - cr.t0) / 1000; let m = Math.exp(CRASH_SPEED * t);
  if (cr.state === "flying" && cr.auto && m >= cr.auto) cashOut(cr.auto);
  if (cr.point && m >= cr.point) { m = cr.point; cr.m = m; crashDraw(m, Math.log(m) / CRASH_SPEED); return crashEnd(); }
  cr.m = m; crashDraw(m, t);
  requestAnimationFrame(crashTick);
}
async function cashOut(atM) {
  if (cr.state !== "flying") return;
  cr.state = "cashing"; const id = cr.id, m = Math.floor((atM || cr.m) * 100) / 100;
  const b = document.getElementById("cbtn"); if (b) b.disabled = true;
  let res;
  try { res = await api("crash.cash", { m }); }
  catch (e) { if (cr.id === id && cr.state === "cashing") { cr.state = "flying"; if (b) b.disabled = false; } return popToast(e.message); }
  if (cr.id !== id) return;
  showEv(res.ev);
  const r = res.r; if (!cr.point) cr.point = r.point;
  if (r.pay > 0) crashCashedUI(r);
  else { cr.state = "flying"; } // не успели — самолётик уже улетел
}
function crashEnd() {
  const lost = cr.state !== "cashed";
  if (lost) sessNote(-cr.bet);
  cr.state = "idle";
  document.querySelectorAll("[data-auto],[data-bet],[data-bop]").forEach(x => x.disabled = false);
  const mu = document.getElementById("mult"); if (!mu) return;
  mu.className = "mult end" + (lost ? " lost" : " won");
  mu.textContent = `Улетел на ${cr.point.toFixed(2)}×`;
  document.getElementById("plane").classList.add("gone");
  if (lost) { document.getElementById("cmsg").textContent = "Не успели — ставка сгорела"; sfx.boom(); }
  document.getElementById("hist").innerHTML = histHTML();
  const b = document.getElementById("cbtn"); b.classList.remove("cash"); b.textContent = "Взлёт"; b.disabled = false;
}

/* ================= Через дорогу ================= */
// Каждую полосу решает сервер в момент шага.
let rd = { lv: "mid", state: "idle", step: 0, bet: 0, busy: false };
const LANE_W = 78, SIDE_W = 70;
function renderRoad() {
  if (rd.state === "idle" && S.g?.k === "road") Object.assign(rd, { lv: S.g.lv, state: "run", step: S.g.step, bet: S.g.bet });
  const L = ROAD[rd.lv], active = rd.state === "run";
  let lanes = "";
  for (let i = 1; i <= L.n; i++) lanes += `<div class="lane" data-i="${i}" style="--d:${(1.3 + rand(120) / 100).toFixed(2)}s;--del:-${(rand(200) / 100).toFixed(2)}s"><div class="car" aria-hidden="true">🚗</div><div class="mlt">${roadMult(rd.lv, i)}×</div></div>`;
  app.innerHTML = `<section class="screen wrap s-road">
    <div class="topbar"><button class="back" id="back">← Лобби</button>${balHTML()}</div>
    <h2 class="road-title">Через дорогу</h2>
    <div class="levels" role="group" aria-label="Сложность">${Object.entries(ROAD).map(([k, v]) => `<button data-lv="${k}" aria-pressed="${k === rd.lv}" ${active ? "disabled" : ""}>${v.t}</button>`).join("")}</div>
    <div class="roadview" id="rview"><div class="track" id="track"><div class="side"></div>${lanes}<div class="side fin"></div><span class="chicken" id="chick" aria-label="Курочка">${chickHTML()}</span></div></div>
    <div class="roadmsg" id="rmsg" role="status">${active ? "Вперёд или забрать?" : `До ${roadMult(rd.lv, L.n)}× за ${L.n} полос`}</div>
    <div id="rctl"></div>
    <p class="fine" style="text-align:center">Чем сложнее, тем чаще машины и выше множители. Сбила машина — ставка сгорает.</p>
  </section>`;
  const root = app.querySelector(".screen");
  root.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { if (rd.state === "run") return; rd.lv = b.dataset.lv; rd.state = "idle"; rd.step = 0; renderRoad(); });
  document.getElementById("back").onclick = () => { if (rd.state === "run") return; rd.state = "idle"; rd.step = 0; renderLobby(); };
  roadUpdate(); roadControls();
}
function roadControls() {
  const c = document.getElementById("rctl"); if (!c) return;
  if (rd.state === "run") {
    c.innerHTML = `<div class="row2"><button class="btn roadbtn" id="fwd">Вперёд</button><button class="btn gold" id="take" ${rd.step ? "" : "disabled"}>${rd.step ? "Забрать " + fmt(Math.floor(rd.bet * roadMult(rd.lv, rd.step))) : "Забрать"}</button></div>`;
    document.getElementById("fwd").onclick = roadStep;
    document.getElementById("take").onclick = () => roadCash();
  } else {
    c.innerHTML = `${betsHTML()}<button class="btn roadbtn" id="rstart" style="width:100%;margin-top:10px">Старт</button>`;
    wireBets(c);
    document.getElementById("rstart").onclick = roadStart;
  }
}
function roadUpdate(hitLane) {
  document.querySelectorAll(".lane").forEach(l => {
    const i = +l.dataset.i;
    l.classList.toggle("done", i <= rd.step && rd.state !== "idle");
    l.classList.toggle("next", rd.state === "run" && i === rd.step + 1);
    l.classList.toggle("hit", i === hitLane);
  });
  const x = hitLane ? SIDE_W + (hitLane - 1) * LANE_W + LANE_W / 2 : rd.step ? SIDE_W + (rd.step - 1) * LANE_W + LANE_W / 2 : SIDE_W / 2;
  const ch = document.getElementById("chick"); if (!ch) return; ch.style.left = x + "px";
  const vw = document.getElementById("rview").clientWidth;
  document.getElementById("track").style.transform = `translateX(${-Math.max(0, x - vw * 0.35)}px)`;
}
async function roadDo(a, x) {
  if (rd.busy) return null; rd.busy = true;
  document.querySelectorAll("#rctl button").forEach(b => b.disabled = true);
  try { return await api(a, x); } catch (e) { apiErr(e, renderRoad); if (e.code === 409) { rd.state = "idle"; rd.step = 0; } renderRoad(); return null; } finally { rd.busy = false; }
}
async function roadStart() {
  if (!canBet(S.bet, renderRoad)) return;
  const bet = S.bet; sessTouch(bet); S.lastBet = bet;
  const res = await roadDo("road.start", { bet, lv: rd.lv }); if (!res) return;
  showEv(res.ev);
  Object.assign(rd, { state: "run", step: 0, bet });
  renderRoad();
}
async function roadStep() {
  if (rd.state !== "run") return;
  const res = await roadDo("road.step"); if (!res) return;
  const r = res.r, L = ROAD[rd.lv];
  if (r.ok) {
    rd.step = r.step; sfx.pop(rd.step);
    if (r.finish) { roadUpdate(); return roadDone(res, "Дошла до конца! "); }
    roadUpdate(); roadControls();
    document.getElementById("rmsg").textContent = `Полоса ${rd.step} из ${L.n}: ${roadMult(rd.lv, rd.step)}×`;
  } else {
    showEv(res.ev); sessNote(-rd.bet); rd.state = "lost";
    roadUpdate(rd.step + 1);
    const ch = document.getElementById("chick"); ch.textContent = "💥"; ch.classList.add("dead"); sfx.boom();
    document.getElementById("rmsg").textContent = "Бип-бип! Курочку сбили — ставка сгорела";
    document.querySelectorAll("[data-lv]").forEach(b => b.disabled = false);
    rd.state = "idle"; rd.step = 0; roadControls();
  }
}
async function roadCash() {
  if (rd.state !== "run" || !rd.step) return;
  const res = await roadDo("road.cash"); if (res) roadDone(res, "");
}
function roadDone(res, prefix) {
  const r = res.r; showEv(res.ev); sessNote(r.pay - rd.bet); winUI(r.pay, rd.bet, r.m);
  rd.state = "won"; roadUpdate();
  document.getElementById("rmsg").textContent = `${prefix}Забрали ${r.m}×: +${fmt(r.pay - rd.bet)}`;
  document.querySelectorAll("[data-lv]").forEach(b => b.disabled = false);
  rd.state = "idle"; rd.step = 0; roadControls();

/* ================= Минное поле ================= */
// Мины расставляет сервер и показывает их только в конце игры.
let mn = { count: 3, state: "idle", bet: 0, mines: new Set(), open: new Set(), boom: -1, busy: false };
function renderMines() {
  if (mn.state !== "run" && S.g?.k === "mines") Object.assign(mn, { count: S.g.count, state: "run", bet: S.g.bet, mines: new Set(), open: new Set(S.g.open), boom: -1, msg: "Продолжайте — открывайте клетки" });
  const run = mn.state === "run", over = mn.state === "over";
  const k = mn.open.size, next = minesMult(mn.count, k + 1);

    const isOpen = mn.open.has(i), isMine = mn.mines.has(i);
    let cls = "mcell", txt = "";
    if (isOpen) { cls += " safe"; txt = "💎"; }
    else if (i === mn.boom) { cls += " boom"; txt = "💣"; }
    else if (over) { txt = isMine ? "💣" : "💎"; cls += " dim"; }
    cells += `<button class="${cls}" data-c="${i}" ${run && !isOpen ? "" : "disabled"} aria-label="Клетка ${i + 1}">${txt}</button>`;
  }
  app.innerHTML = `<section class="screen wrap s-mines">
    <div class="topbar"><button class="back" id="back">← Лобби</button>${balHTML()}</div>
    <h2 class="mines-title">Минное поле</h2>
    <div class="mcount" role="group" aria-label="Количество мин">${MINE_OPTS.map(c => `<button data-mc="${c}" aria-pressed="${c === mn.count}" ${run ? "disabled" : ""}>${c} мин</button>`).join("")}</div>
    <div class="minfo"><span>Кристаллов: <b>${k}</b> из ${25 - mn.count}</span><span>След.: <b>${next}×</b></span></div>

    ${run ? `<div class="row2"><button class="btn ghost" id="mrand">Случайная</button><button class="btn gold" id="mtake" ${k ? "" : "disabled"}>${k ? "Забрать " + fmt(Math.floor(mn.bet * minesMult(mn.count, k))) : "Забрать"}</button></div>`
      : `${betsHTML()}<button class="btn mbtn" id="mstart">Играть</button>`}
    <p class="fine" style="text-align:center;color:#9cc9c3">Больше мин — выше множители. Попали на мину — ставка сгорает.</p>
  </section>`;
  const root = app.querySelector(".screen");
  document.getElementById("back").onclick = () => { if (mn.state === "run") return; mn.state = "idle"; mn.msg = ""; mn.open.clear(); mn.boom = -1; renderLobby(); };
  root.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => { mn.count = +b.dataset.mc; mn.state = "idle"; mn.open.clear(); mn.mines.clear(); mn.boom = -1; mn.msg = ""; renderMines(); });
  root.querySelectorAll("[data-c]").forEach(b => b.onclick = () => minesPick(+b.dataset.c));
  if (run) {
    document.getElementById("mtake").onclick = minesCash;
    document.getElementById("mrand").onclick = () => { const free = [...Array(25).keys()].filter(i => !mn.open.has(i)); minesPick(free[rand(free.length)]); };
  } else { wireBets(root); document.getElementById("mstart").onclick = minesStart; }
}
async function minesDo(a, x) {
  if (mn.busy) return null; mn.busy = true;
  try { return await api(a, x); } catch (e) { apiErr(e, renderMines); if (e.code === 409) mn.state = "idle"; renderMines(); return null; } finally { mn.busy = false; }
}
async function minesStart() {
  if (!canBet(S.bet, renderMines)) return;
  const bet = S.bet; sessTouch(bet); S.lastBet = bet;
  const res = await minesDo("mines.start", { bet, count: mn.count }); if (!res) return;
  showEv(res.ev);
  Object.assign(mn, { state: "run", bet, mines: new Set(), open: new Set(), boom: -1, msg: "Открывайте клетки" });
  renderMines();
}
async function minesPick(i) {
  if (mn.state !== "run" || mn.open.has(i)) return;
  const res = await minesDo("mines.pick", { i }); if (!res) return;
  const r = res.r;
  if (r.boom != null) { mn.mines = new Set(r.mines); mn.boom = r.boom; mn.state = "over"; mn.msg = "Бум! Мина — ставка сгорела"; sfx.boom(); showEv(res.ev); sessNote(-mn.bet); return renderMines(); }
  mn.open = new Set(r.open); sfx.pop(mn.open.size);
  if (r.done) return minesDone(res);

  renderMines();
}
async function minesCash() {
  if (mn.state !== "run" || !mn.open.size) return;
  const res = await minesDo("mines.cash"); if (res) minesDone(res);
}
function minesDone(res) {
  const r = res.r; mn.mines = new Set(r.mines); mn.open = new Set(r.open);
  showEv(res.ev); sessNote(r.pay - mn.bet); winUI(r.pay, mn.bet, r.m);
  mn.state = "over"; mn.msg = `Забрали ${r.m}×: ${r.pay >= mn.bet ? "+" : ""}${fmt(r.pay - mn.bet)}`;
  renderMines();
}

/* ================= Звездопад (плинко) ================= */
// 12 рядов, на каждом штырьке 50/50 влево-вправо. Отдача каждой таблицы ≈ 90%.
const P_COLORS = ["#2e2440", "#3a2a4a", "#4e3048", "#6a3a3e", "#8a4e30", "#a8742c", "#c9962e"]; // от центра к краям
const pColor = k => P_COLORS[Math.abs(k - 6)];
let pl = { risk: "mid", balls: [], pegLit: {}, bucketHit: {}, floats: [], hist: [], auto: 0, autoTimer: null, raf: 0, last: "" };
function pGeom(cv) {
  const W = cv.clientWidth, gap = W / (P_ROWS + 2.4), rowH = gap * 1.04, top = gap * 0.9;
  return { W, gap, rowH, top, cx: W / 2, pegR: Math.max(2.2, gap * 0.1), ballR: gap * 0.24, bucketY: top + P_ROWS * rowH + gap * 0.25, bucketH: gap * 1.05, H: top + P_ROWS * rowH + gap * 1.5 };
}
function renderPlinko() {
  const busy = pl.balls.length > 0;
  app.innerHTML = `<section class="screen wrap s-plinko">
    <div class="topbar"><button class="back" id="back">← Лобби</button>${balHTML()}</div>
    <h2 class="plinko-title">Звездопад</h2>
    <div class="pboard"><canvas id="pcv" aria-label="Поле со звёздами"></canvas><div class="phist" id="phist"></div></div>
    <div class="pmsg" id="pmsg" role="status">${pl.last || "Бросайте комету — где она упадёт?"}</div>
    <div class="prisk" role="group" aria-label="Риск">${Object.entries(P_RISK).map(([k, v]) => `<button data-risk="${k}" aria-pressed="${k === pl.risk}" ${busy ? "disabled" : ""}>${v.t}</button>`).join("")}</div>
    ${betsHTML()}
    <div class="pctl"><button class="btn pdrop" id="pdrop">Бросить</button><button class="pauto" id="pauto" aria-pressed="${!!pl.auto}">${pl.auto ? "Стоп " + pl.auto : "Авто ×10"}</button></div>
    <p class="fine" style="text-align:center;color:#b3a8db">Можно бросать несколько комет подряд. Края — редко, но крупно.</p>
  </section>`;
  const root = app.querySelector(".screen");
  wireBets(root);
  pHistDraw();
  const cv = document.getElementById("pcv");
  const fit = () => { const g = pGeom(cv), dpr = Math.min(3, window.devicePixelRatio || 1); cv.style.height = g.H + "px"; cv.width = Math.round(g.W * dpr); cv.height = Math.round(g.H * dpr); cv.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); pDraw(performance.now()); };
  fit(); window.onresize = () => document.getElementById("pcv") && fit();
  root.querySelectorAll("[data-risk]").forEach(b => b.onclick = () => { if (pl.balls.length) return; pl.risk = b.dataset.risk; root.querySelectorAll("[data-risk]").forEach(x => x.setAttribute("aria-pressed", x === b)); pDraw(performance.now()); });
  document.getElementById("pdrop").onclick = () => pDrop(true);
  document.getElementById("pauto").onclick = pToggleAuto;
  document.getElementById("back").onclick = () => { pStopAuto(); pl.balls.forEach(b => pLand(b)); pl.balls = []; window.onresize = null; renderLobby(); };
}
function pSetRiskLock() { document.querySelectorAll("[data-risk]").forEach(b => b.disabled = pl.balls.length > 0 || pl.pending > 0); }
// путь кометы и выигрыш решает сервер; экран только показывает полёт
async function pDrop(manual) {
  if (manual ? !canBet(S.bet, renderPlinko) : shown() < S.bet) { if (!manual) pStopAuto(); return false; }
  const bet = S.bet, risk = pl.risk;

    rows += `<div class="tw-row${cur ? " cur" : ""}${done ? " done" : ""}"><span class="lvl">${twMult(tw.lv, r + 1)}×</span><div class="tw-tiles" style="grid-template-columns:repeat(${L.cols},1fr)">${tiles}</div></div>`;
  }
  app.innerHTML = `<section class="screen wrap s-tower">
    <div class="tw-snow" aria-hidden="true">${Array.from({ length: 24 }, (_, i) => `<i style="left:${(i * 41) % 100}%;animation-duration:${6 + (i % 5) * 2}s;animation-delay:-${(i * 1.3) % 10}s;width:${2 + (i % 3)}px;height:${2 + (i % 3)}px"></i>`).join("")}</div>
    <div class="topbar"><button class="back" id="back">← Лобби</button>${balHTML()}</div>
    <h2 class="tw-title">Ледяная башня</h2>
    <div class="levels" role="group" aria-label="Сложность">${Object.entries(TW).map(([k, v]) => `<button data-lv="${k}" aria-pressed="${k === tw.lv}" ${run ? "disabled" : ""}>${v.t}</button>`).join("")}</div>
    <div class="tw-tower">${rows}</div>
    <div class="tw-msg" role="status">${esc(tw.msg || `${L.safe} из ${L.cols} плиток безопасны · до ${twMult(tw.lv, TW_ROWS)}×`)}</div>
    ${run ? `<button class="btn gold" id="twtake" ${tw.row ? "" : "disabled"}>${tw.row ? "Забрать " + fmt(Math.floor(tw.bet * twMult(tw.lv, tw.row))) : "Выберите плитку"}</button>`
      : `${betsHTML()}<button class="btn tw-btn" id="twgo">Начать подъём</button>`}
  </section>`;
  const root = app.querySelector(".screen");
  root.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { if (tw.state === "run") return; tw = { lv: b.dataset.lv, state: "idle", row: 0, bet: 0, traps: [], picks: [], msg: "" }; renderTower(); });
  root.querySelectorAll(".tw-row.cur [data-c]").forEach(b => b.onclick = () => twPick(+b.dataset.c));
  document.getElementById("back").onclick = () => { if (tw.state === "run") return; tw = { lv: tw.lv, state: "idle", row: 0, bet: 0, traps: [], picks: [], msg: "" }; renderLobby(); };
  if (run) document.getElementById("twtake").onclick = twCash;
  else { wireBets(root); document.getElementById("twgo").onclick = twStart; }
}
async function twDo(a, x) {
  if (tw.busy) return null; tw.busy = true;
  try { return await api(a, x); } catch (e) { apiErr(e, renderTower); if (e.code === 409) tw.state = "idle"; renderTower(); return null; } finally { tw.busy = false; }
}
async function twStart() {
  if (!canBet(S.bet, renderTower)) return;
  const bet = S.bet; sessTouch(bet); S.lastBet = bet;
  const res = await twDo("tower.start", { bet, lv: tw.lv }); if (!res) return;
  showEv(res.ev);
  tw = { lv: tw.lv, state: "run", row: 0, bet, traps: [], picks: [], msg: "Выберите плитку на первом этаже" };
  renderTower();
}
async function twPick(c) {
  if (tw.state !== "run") return;
  const res = await twDo("tower.pick", { c }); if (!res) return;
  const r = res.r; tw.picks = r.picks;
  if (r.lost) {
    tw.traps = r.traps; tw.lostRow = r.lostRow; tw.state = "over"; tw.msg = "Лёд треснул — ставка сгорела"; sfx.crack(); showEv(res.ev); sessNote(-tw.bet);
    try { TG?.HapticFeedback?.notificationOccurred("error"); } catch (e) {}
    return renderTower();
  }
  tw.row = r.row; sfx.pop(tw.row * 2);
  try { TG?.HapticFeedback?.impactOccurred("light"); } catch (e) {}
  if (r.done) return twDone(res);
  tw.msg = `Этаж ${tw.row}: ${twMult(tw.lv, tw.row)}× — выше или забрать?`;
  renderTower();
}
async function twCash() {
  if (tw.state !== "run" || !tw.row) return;
  const res = await twDo("tower.cash"); if (res) twDone(res);
}
function twDone(res) {
  const r = res.r; tw.traps = r.traps; tw.picks = r.picks; tw.row = r.row;
  showEv(res.ev); sessNote(r.pay - tw.bet); winUI(r.pay, tw.bet, r.m);
  tw.state = "over"; tw.lostRow = -1; tw.msg = `${tw.row === TW_ROWS ? "Вершина! " : ""}Забрали ${r.m}×: ${r.pay >= tw.bet ? "+" : ""}${fmt(r.pay - tw.bet)}`;
  renderTower();
}
